services:
  postgres:
    image: postgres:16-alpine
    container_name: claude-token-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: claude_token_tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tracker
    mem_limit: 2g
    mem_reservation: 512m
    shm_size: 256mb
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=1GB
      -c max_connections=50
      -c log_min_duration_statement=1000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d claude_token_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  tracker:
    driver: bridge

volumes:
  pgdata:
